<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Contact — CareerStudioMax Developer Cloud</title>
<meta name="description" content="Reach the CareerStudioMax Developer Cloud team — sales, support, or a general question.">
<link rel="canonical" href="https://dev.careerstudiomax.com/contact">
<style>
:root{--bg:#0a0a0f;--s:#12121a;--b:#1e1e2e;--t:#e2e8f0;--m:#94a3b8;--a:#6366f1;--ah:#818cf8;--g:#10b981;--r:#ef4444;--f:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--t);font-family:var(--f);line-height:1.6;min-height:100vh}
a{color:var(--a);text-decoration:none}a:hover{color:var(--ah)}
nav{display:flex;justify-content:space-between;align-items:center;padding:16px 40px;border-bottom:1px solid var(--b);position:sticky;top:0;background:rgba(10,10,15,0.95);backdrop-filter:blur(12px);z-index:100}
.logo{font-size:18px;font-weight:700;letter-spacing:-0.5px}.logo span{color:var(--a)}
.nav-links{display:flex;gap:24px;font-size:14px;color:var(--m)}
.nav-links a{color:var(--m)}.nav-links a:hover{color:var(--t)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:8px 18px;border-radius:6px;font-size:14px;font-weight:500;cursor:pointer;border:none}
.btn-primary{background:var(--a);color:#fff}.btn-primary:hover{background:var(--ah)}
.wrap{max-width:560px;margin:0 auto;padding:64px 24px 100px}
h1{font-size:34px;font-weight:800;letter-spacing:-1.5px;margin-bottom:10px;text-align:center}
.lead{color:var(--m);font-size:15px;margin-bottom:36px;text-align:center}
.card{background:var(--s);border:1px solid var(--b);border-radius:12px;padding:28px}
.f-row{margin-bottom:16px}
.f-label{display:block;font-size:13px;color:var(--m);margin-bottom:5px}
.f-input,.f-select,.f-textarea{width:100%;background:#0d1117;border:1px solid var(--b);color:var(--t);padding:10px 14px;border-radius:6px;font-size:14px;outline:none;font-family:var(--f)}
.f-input:focus,.f-select:focus,.f-textarea:focus{border-color:var(--a)}
.f-textarea{resize:vertical;min-height:120px}
.f-select{cursor:pointer}
.f-submit{width:100%;padding:12px;border-radius:6px;font-size:14px;font-weight:600;border:none;cursor:pointer;background:var(--a);color:#fff;margin-top:4px}
.f-submit:hover{background:var(--ah)}
.f-submit:disabled{opacity:.6;cursor:default}
.f-status{margin-top:14px;padding:12px 14px;border-radius:6px;font-size:13.5px;line-height:1.6;display:none}
.f-status.ok{display:block;background:rgba(16,185,129,.1);border:1px solid rgba(16,185,129,.3);color:var(--g)}
.f-status.err{display:block;background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);color:var(--r)}
.direct{margin-top:22px;text-align:center;font-size:13px;color:var(--m)}
</style>
</head>
<body>
<nav>
  <a href="/" class="logo">CareerStudioMax <span>Developer Cloud</span></a>
  <div class="nav-links">
    <a href="/docs">Docs</a>
    <a href="/quickstart">Quickstart</a>
    <a href="/pricing">Pricing</a>
    <a href="/dashboard">Dashboard</a>
  </div>
</nav>

<div class="wrap">
  <h1>Get in touch</h1>
  <p class="lead">Sales, support, or a general question about the Developer Cloud API — a real person reads every message.</p>

  <div class="card">
    <form id="cForm" onsubmit="return submitContact(event)">
      <div class="f-row">
        <label class="f-label" for="cName">Name</label>
        <input class="f-input" id="cName" required maxlength="200">
      </div>
      <div class="f-row">
        <label class="f-label" for="cEmail">Email</label>
        <input class="f-input" id="cEmail" type="email" required maxlength="200">
      </div>
      <div class="f-row">
        <label class="f-label" for="cTopic">Topic</label>
        <select class="f-select" id="cTopic">
          <option value="partnership">Enterprise plan</option>
          <option value="billing">Billing</option>
          <option value="support">Product support</option>
          <option value="bug">Report a bug</option>
          <option value="general">General question</option>
        </select>
      </div>
      <div class="f-row">
        <label class="f-label" for="cMessage">Message</label>
        <textarea class="f-textarea" id="cMessage" required maxlength="4000"></textarea>
      </div>
      <button class="f-submit" id="cSubmitBtn" type="submit">Send message</button>
      <div class="f-status" id="cStatus"></div>
    </form>
    <div class="direct">Prefer email? <a href="mailto:api@careerstudiomax.com">api@careerstudiomax.com</a></div>
  </div>
</div>

<script>
// Deliberately NOT window.CS_API_BASE -- that points at this product's own
// api-platform host (careerlm-api.careerstudiomax.com, see config.js),
// which has no /api/contact route of its own. The real, working contact
// backend (DB persistence + admin/confirmation emails) lives on cs_fixed,
// the main server at careerstudiomax.com -- a different deployment
// entirely. See cs_fixed/middleware/security.js's CORS allowlist for the
// dev.careerstudiomax.com entry this depends on.
const CONTACT_API = 'https://careerstudiomax.com/api/contact';

(function () {
  const params = new URLSearchParams(location.search);
  const plan = params.get('plan');
  const topic = params.get('topic');
  if (topic) document.getElementById('cTopic').value = topic;
  if (plan) document.getElementById('cMessage').value = `Interested in the ${plan} plan.\n\n`;
})();

async function submitContact(e) {
  e.preventDefault();
  const btn = document.getElementById('cSubmitBtn');
  const status = document.getElementById('cStatus');
  const payload = {
    name:    document.getElementById('cName').value.trim(),
    email:   document.getElementById('cEmail').value.trim(),
    topic:   document.getElementById('cTopic').value,
    message: `[Developer Cloud] ${document.getElementById('cMessage').value.trim()}`,
  };
  status.className = 'f-status';
  status.style.display = 'none';
  btn.disabled = true; btn.textContent = 'Sending…';
  try {
    const r = await fetch(CONTACT_API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    const d = await r.json();
    if (d.success) {
      status.textContent = '✓ ' + (d.message || 'Message received — thank you for reaching out.');
      status.className = 'f-status ok';
      document.getElementById('cForm').reset();
    } else {
      status.textContent = d.error || 'Something went wrong — please try again or email api@careerstudiomax.com directly.';
      status.className = 'f-status err';
    }
  } catch (err) {
    status.textContent = 'Network error — please try again or email api@careerstudiomax.com directly.';
    status.className = 'f-status err';
  } finally {
    btn.disabled = false; btn.textContent = 'Send message';
  }
  return false;
}
</script>
</body>
</html>
